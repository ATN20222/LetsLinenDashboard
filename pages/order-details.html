<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/favicon.svg">
    <title>Order Details - LET’S LINEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/Layout.css">
    <link rel="stylesheet" href="../css/import.css">
    <link rel="stylesheet" href="../css/ds-layout.css">
    <link rel="stylesheet" href="../css/ds-orders.css">
    <link rel="stylesheet" href="../css/tabulator-dark.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>
    <div class="ds-app">
        <aside id="sidebar" class="ds-sidebar">
            <div class="ds-brand">
                <img src="../assets/images/Logo.svg" alt="Logo" width="28" height="28">
                <span>LET’S LINEN</span>
            </div>
            <nav class="ds-nav">
                <a href="../index.html">Dashboard</a>
                <a href="./orders.html" class="active">Orders</a>
                <a href="./products.html">Products</a>

            </nav>
        </aside>
        <header class="ds-header">
            <div class="ds-search">
                <img id="sidebarToggle" src="../assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">
                <input type="text" placeholder="Search..." aria-label="Search">
            </div>
            <div class="ds-actions">
                <img src="../assets/icons/user-white.svg" alt="profile" width="24" height="24">
            </div>
        </header>
        <main class="ds-content">
            <div class="container mx-auto px-4">
                <a href="./orders.html" class="back-link inline-block mb-3" data-aos="fade-right">← Back to Orders</a>
                <div class="ds-grid ds-grid-2 mb-4">
                    <div class="ds-card" data-aos="fade-up">
                        <h3 class="mb-2">Order Summary</h3>
                        <div id="orderSummary" class="muted"></div>
                    </div>
                    <div class="ds-card" data-aos="fade-up" data-aos-delay="100">
                        <h3 class="mb-2">Status</h3>
                        <div class="flex gap-2 items-center">
                            <select id="statusSelect">
                                <option>Pending</option>
                                <option>Processing</option>
                                <option>Shipped</option>
                                <option>Delivered</option>
                                <option>Cancelled</option>
                            </select>
                            <button id="saveStatus">Save</button>
                        </div>
                        <div id="statusMessage" class="muted mt-2"></div>
                    </div>
                </div>
                <div class="ds-card" data-aos="fade-up" data-aos-delay="150">
                    <h3 class="mb-2">Items</h3>
                    <div id="itemsList" class="muted">No items demo for now.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script> if (window.AOS) { AOS.init(); } </script>
    <script src="../js/data/orders.js"></script>
    <script src="../js/order-details.js"></script>
</body>
</html>
