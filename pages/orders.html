<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/favicon.svg">
    <title>Orders - LET’S LINEN</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/Layout.css">
    <link rel="stylesheet" href="../css/import.css">
    <link rel="stylesheet" href="../css/ds-layout.css">
    <link rel="stylesheet" href="../css/ds-orders.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.6.2/dist/css/tabulator.min.css">
    <link rel="stylesheet" href="../css/tabulator-dark.css">
</head>
<body>
    <div class="ds-app">
        <aside id="sidebar" class="ds-sidebar">
            <div class="ds-brand">
                <img src="../assets/images/Logo.svg" alt="Logo" width="28" height="28">
                <span>LET’S LINEN</span>
            </div>
            <nav class="ds-nav">
                <a href="../index.html">Dashboard</a>
                <a href="#" class="active">Orders</a>
                <a href="./products.html">Products</a>

            </nav>
        </aside>
        <header class="ds-header">
            <div class="ds-search">
                <img id="sidebarToggle" src="../assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">
                <input type="text" placeholder="Search..." aria-label="Search">
            </div>
            <div class="ds-actions">
                <img src="../assets/icons/user-white.svg" alt="profile" width="24" height="24">
            </div>
        </header>
        <main class="ds-content">
            <div class="container">
                <h2 class="mb-3" data-aos="fade-up">Orders</h2>
                <div class="orders-toolbar" data-aos="fade-up" data-aos-delay="50">
                    <input id="searchInput" type="search" placeholder="Search by order # or customer">
                    <select id="statusFilter">
                        <option value="">All statuses</option>
                        <option>Pending</option>
                        <option>Processing</option>
                        <option>Shipped</option>
                        <option>Delivered</option>
                        <option>Cancelled</option>
                    </select>
                    <button id="loadDemo" style="padding:8px 12px;border-radius:10px;border:1px solid var(--border-color);background:var(--surface-2);color:var(--text-color);">Load demo data</button>
                </div>
                <div class="orders-table-wrapper" data-aos="fade-up" data-aos-delay="100"><div id="ordersTable"></div></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/tabulator-tables@5.6.2/dist/js/tabulator.min.js"></script>
    <script src="../js/components/table.js"></script>
    <script src="../js/data/orders.js"></script>
    <script src="../js/orders.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      if (window.AOS) { AOS.init(); }
    </script>
</body>
</html>
