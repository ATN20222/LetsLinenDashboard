<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/favicon.svg">
    <title>Add Product - LET’S LINEN</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/Layout.css">
    <link rel="stylesheet" href="../css/import.css">
    <link rel="stylesheet" href="../css/ds-layout.css">
    <link rel="stylesheet" href="../css/ds-products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>
    <div class="ds-app">
        <aside id="sidebar" class="ds-sidebar">
            <div class="ds-brand">
                <img src="../assets/images/Logo.svg" alt="Logo" width="28" height="28">
                <span>LET’S LINEN</span>
            </div>
            <nav class="ds-nav">
                <a href="../index.html">Dashboard</a>
                <a href="./orders.html">Orders</a>
                <a href="./products.html" class="active">Products</a>
            </nav>
        </aside>
        <header class="ds-header">
            <div class="ds-search">
                <img id="sidebarToggle" src="../assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">
                <input type="text" placeholder="Search..." aria-label="Search">
            </div>
            <div class="ds-actions">
                <img src="../assets/icons/user-white.svg" alt="profile" width="24" height="24">
            </div>
        </header>
        <main class="ds-content">
            <div class="container">
                <h2 class="mb-3" data-aos="fade-up">Add Product</h2>
                <form id="productForm" class="form-grid" data-aos="fade-up" data-aos-delay="50">
                    <div class="form-field"><input class="form-control" name="name" placeholder="Product name" required></div>
                    <div class="form-field"><input class="form-control" name="sku" placeholder="SKU" required></div>
                    <div class="form-field"><input class="form-control" name="category" placeholder="Category" required></div>
                    <div class="form-field"><input class="form-control" name="stock" placeholder="Stock" type="number" min="0" value="" required></div>
                    <div class="form-field"><input class="form-control" name="price" placeholder="Base price ($)" type="number" step="0.01" min="0" required></div>
                </form>
                <div class="ds-card mt-3" data-aos="fade-up" data-aos-delay="100">
                    <h3 class="mb-2">Images</h3>
                    <label class="upload-dropzone">
                      <input id="imageInput" type="file" multiple accept="image/*">
                      <span class="upload-hint">Drag & drop images here or</span>
                      <span class="upload-btn">Choose Files</span>
                    </label>
                    <div id="imagesPreview" class="images-grid mt-2"></div>
                </div>
                <div class="ds-card mt-3" data-aos="fade-up" data-aos-delay="150">
                    <div class="variants">
                        <div class="variants-header">
                            <h3>Variants (Color + Size + Price)</h3>
                            <button id="addVariant" class="btn secondary" type="button">Add Variant</button>
                        </div>
                        <div id="variantsList"></div>
                    </div>
                </div>
                <div class="form-actions mt-3">
                    <a class="btn secondary" href="./products.html">Cancel</a>
                    <button id="saveProduct" class="btn">Save Product</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/data/products.js"></script>
    <script src="../js/product-add.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script> if (window.AOS) { AOS.init(); } </script>
</body>
</html>
