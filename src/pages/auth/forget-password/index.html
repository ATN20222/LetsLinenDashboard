<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Odlica" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/src/assets/css/pages/auth/_auth.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- aos css -->

    <title>LET'S LINEN</title>
</head>

<body class="spinner">
        <div class="auth-container">
            <div class="auth-left">
                <div class="auth-top-text">
                    <h1 class="auth-top-text-title">
                        Forgot Password
                    </h1>
                </div>
                <div class="auth-form-container">
                    <form class="auth-form" action="#" method="post" novalidate>
                        <div class="form-field">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-input" placeholder="Example@email.com" required>
                        </div>
                        
                       

                        
                        <button type="submit" class="primary-btn w-full">Send Reset Link</button>
                        <div class="auth-divider"><span>Or</span></div>
                        <p class="auth-bottom-text">Remembered your password? <a href="../login/index.html" class="auth-link">Back to Sign in</a></p>
                        
                    </form>
                    <div class="auth-copyright-text">
                        © 2025 ALL RIGHTS RESERVED
                    </div>
                </div>
            </div>
            <div class="auth-right">
                <img src="/src/assets/img/login-image.jpg" width="100%" height="100%" alt="login-image">

            </div>
        </div>

    <script type="module" src="/src/main.js"></script>
    <!-- aos js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <!-- landing js -->
    <script type="module" src="/src/assets/js/pages/auth/forget-password/_forget-password.js"></script>
</body>

</html>
