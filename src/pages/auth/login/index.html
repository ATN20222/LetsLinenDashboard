<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Odlica" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/src/assets/css/pages/auth/_auth.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- aos css -->

    <title>LET'S LINEN</title>
</head>

<body class="spinner">
        <!-- Login Section -->
        <div class="auth-container">
            <div class="auth-left">
                <div class="auth-top-text">
                    <h1 class="auth-top-text-title">Welcome To <br>
                        Let’s Linen  
                    </h1>
                </div>
                <div class="auth-form-container">
                    <form class="auth-form" action="#" method="post" novalidate>
                        <div class="form-field">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-input" placeholder="Example@email.com" required>
                        </div>
                        <div class="form-field">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-input" placeholder="At least 8 characters" minlength="8" required>
                        </div>
                        <div class="forgot-password-container">
                            <a class="forgot-password" href="../forget-password/index.html">Forgot Password?</a>
                        </div>
                        <button type="submit" class="primary-btn w-full">Sign in</button>
                        <div class="auth-divider"><span>Or</span></div>
                        <button type="button" class="google-btn">
                            <span class="google-icon">
                                <img src="/src/assets/icons/Google.svg" alt="google">
                            </span>
                            <span>Sign in with Google</span>
                        </button>
                        <p class="auth-bottom-text">Don't you have an account ? <a href="../register/index.html" class="auth-link">Sign up</a></p>
                    </form>
                    <div class="auth-copyright-text">
                        © 2025 ALL RIGHTS RESERVED
                    </div>
                </div>
            </div>
            <div class="auth-right">
                <img src="/src/assets/img/login-image.jpg" width="100%" height="100%" alt="login-image">

            </div>
        </div>
    <!-- Login Section End -->

    <script type="module" src="/src/main.js"></script>
    <!-- aos js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <!-- landing js -->
    <script type="module" src="/src/assets/js/pages/auth/login/_login.js"></script>
</body>

</html>
