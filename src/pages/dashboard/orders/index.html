<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Odlica" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/favicon.svg" />
    <title>LET'S LINEN . Dashboard</title>
  </head>
  <body class="spinner">
    
    <div class="ds-app">
      
      <!-- Sidebar -->
    <aside id="sidebar" class="ds-sidebar">
        <div class="ds-brand">
            <img src="/src/assets/img/Logo.svg" alt="Logo" width="28" height="28">
            <span>LET’S LINEN</span>
        </div>
        <nav class="ds-nav">
            <a href="../index.html">Dashboard</a>

        <div class="ds-search">
            <img id="sidebarToggle" src="/src/assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">

          <div id="ordersTable"></div>
          </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/assets/js/pages/dashboard/orders/_orders.js"></script>
