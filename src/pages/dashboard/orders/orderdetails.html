<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Odlica" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>LET'S LINEN . Dashboard</title>
  </head>
  <body class="spinner">
    
    <div class="ds-app">
      
      <!-- Sidebar -->
    <aside id="sidebar" class="ds-sidebar">
        <div class="ds-brand">
            <img src="/src/assets/img/Logo.svg" alt="Logo" width="28" height="28">
            <span>LET’S LINEN</span>
        </div>
        <nav class="ds-nav">
            <a href="../index.html">Dashboard</a>
            <a href="#" class="active">Orders</a>
            <a href="/src/pages/dashboard/products/index.html">Products</a>
        </nav>
    </aside>

    <!-- Header -->
    <header class="ds-header">
        <div class="ds-search">
            <img id="sidebarToggle" src="/src/assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">
            <input type="text" placeholder="Search..." aria-label="Search">
        </div>
        <div class="ds-actions">
            <img src="/src/assets/icons/logout.svg" alt="profile" width="24" height="24">
        </div>
    </header>

    <main class="ds-content">
        <div class="mx-auto px-4">
            <a href="../orders/index.html" class="back-link inline-block mb-3" data-aos="fade-right">← Back to Orders</a>
            <div class="ds-grid ds-grid-2 mb-4">
                <div class="ds-card" data-aos="fade-up">
                    <h3 class="!mb-2">Order Summary</h3>
                    <div id="orderSummary" class="muted">
                        <div class="mb-1.5">Order #: <strong>100234</strong></div>
                        <div class="mb-1.5">Customer: <strong>Jane Doe</strong></div>
                        <div class="mb-1.5">Date: <strong>2024-06-10</strong></div>
                        <div>Total: <strong>$129.99</strong></div>
                    </div>
                </div>

                <div class="ds-card" data-aos="fade-up" data-aos-delay="100">
                    <h3 class="!mb-2">Status</h3>
                    <div class="flex gap-2 items-center">
                        <select id="statusSelect">
                            <option>Pending</option>
                            <option>Processing</option>
                            <option>Shipped</option>
                            <option>Delivered</option>
                            <option>Cancelled</option>
                        </select>
                        <button id="saveStatus" class="ds-primary-btn">Save</button>
                    </div>
                    <div id="statusMessage" class="muted mt-2"></div>
                </div>
            </div>

            <div class="ds-card" data-aos="fade-up" data-aos-delay="150">
                <h3 class="!mb-2">Items</h3>
                <div id="itemsList" class="muted">
                   
                </div>
            </div>
        </div>
    </main>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/assets/js/pages/dashboard/orders/_orders.js"></script>
    <script type="module" src="/src/assets/js/pages/dashboard/_dashboard.js"></script>
  </body>
</html>
