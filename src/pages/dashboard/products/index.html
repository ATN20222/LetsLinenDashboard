<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Odlica" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>LET'S LINEN . Dashboard</title>
  </head>
  <body class="spinner">
    
    <div class="ds-app">
      
      <!-- Sidebar -->
    <aside id="sidebar" class="ds-sidebar">
        <div class="ds-brand">
            <img src="/src/assets/img/Logo.svg" alt="Logo" width="28" height="28">
            <span>LET’S LINEN</span>
        </div>
        <nav class="ds-nav">
            <a href="../index.html">Dashboard</a>
            <a href="../orders/index.html">Orders</a>
            <a href="#" class="active">Products</a>
        </nav>
    </aside>

    <!-- Header -->
    <header class="ds-header">
        <div class="ds-search">
            <img id="sidebarToggle" src="/src/assets/icons/bars-white.svg" alt="menu" width="18" height="18" aria-controls="sidebar" aria-expanded="false">
            <input type="text" placeholder="Search..." aria-label="Search">
        </div>
            <a href="/" class="ds-actions">
            <img src="/src/assets/icons/logout.svg" alt="profile" width="24" height="24">
            </a>
    </header>

    <main class="ds-content !p-10">     
        <div class="flex justify-end">
            <a href="/src/pages/dashboard/products/add-product.html" class="ds-primary-btn">Add Product</a>
        </div>
        <div class="overflow-x-auto rounded-xl">
          <div class="table">
          <div class="header">
            <h6>Products table</h6>
            <div class="table-header__actions">
              <button id="filters-btn" class="main-btn">
                <i class="fi fi-sr-settings-sliders"></i> Filters
              </button>
            </div>
          </div>
          <div id="productsTable"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmDeleteBackdrop" class="ds-modal-backdrop" hidden>
      <div class="ds-modal" role="dialog" aria-modal="true" aria-label="Delete product">
        <div class="ds-modal-header">Delete product</div>
        <div class="ds-modal-body">Are you sure you want to delete this product?</div>
        <div class="ds-modal-actions">
          <button class="ds-secondary-btn" data-action="cancel">Cancel</button>
          <button class="ds-danger-btn" data-action="confirm">Delete</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script type="module" src="/src/assets/js/pages/dashboard/products/_products.js"></script>
    <script type="module" src="/src/assets/js/pages/dashboard/_dashboard.js"></script>
  </body>
</html>
